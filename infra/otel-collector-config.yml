receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024
  
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
  
  # Adiciona informações de resource
  resource:
    attributes:
      - key: service.name
        action: upsert
        from_attribute: service.name
      - key: service.environment
        action: upsert
        from_attribute: service.environment

  # Extrai trace_id e span_id para attributes
  attributes:
    actions:
      - key: trace_id
        action: upsert
        from_context: trace_id
      - key: span_id
        action: upsert
        from_context: span_id

exporters:
  # Loki para logs
  loki:
    endpoint: http://loki:3100/loki/api/v1/push

  # OTLP para Tempo (traces) - ÚNICO BACKEND DE TRACES
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Prometheus para métricas
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: app
    
  # Debug
  debug:
    verbosity: detailed
    sampling_initial: 5
    sampling_thereafter: 200

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  
  pipelines:
    # Traces: OTLP -> Tempo
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo, debug]
    
    # Metrics: OTLP -> Prometheus
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus, debug]
    
    # Logs: OTLP -> Loki
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, attributes, batch]
      exporters: [loki, debug]

  telemetry:
    logs:
      level: info